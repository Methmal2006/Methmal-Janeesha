<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141d" />
      <stop offset="50%" stop-color="#0c0c12" />
      <stop offset="100%" stop-color="#181324" />
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="750" rx="36" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glowing Aura -->
  <circle cx="300" cy="320" r="240" fill="url(#ambientGlow)" />
  
  <!-- Futuristic Decorative Grid / Orbit Rings -->
  <circle cx="300" cy="340" r="200" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="300" cy="340" r="260" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 8"/>

  <!-- Stylish Portrait Silhouette Mask -->
  <g transform="translate(150, 160)">
    <!-- Head & Shoulders silhouette -->
    <path d="M150 70 A65 65 0 0 0 150 200 A65 65 0 0 0 150 70 Z" fill="#242436" stroke="url(#purpleAccent)" stroke-width="2.5" />
    <!-- Modern tech visor / glow line -->
    <path d="M110 130 Q150 145 190 130" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" filter="url(#glowFilter)" />
    <!-- Torso silhouette -->
    <path d="M60 380 C60 270 100 240 150 240 C200 240 240 270 240 380 Z" fill="#1b1b2a" stroke="rgba(168,85,247,0.3)" stroke-width="2" />
    <!-- Jacket lapels -->
    <path d="M115 242 L150 310 L185 242" fill="none" stroke="url(#purpleAccent)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Futuristic Corner Brackets -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
  <path d="M 530 40 L 560 40 L 560 70" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
  <path d="M 40 680 L 40 710 L 70 710" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
  <path d="M 530 710 L 560 710 L 560 680" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />

  <!-- Placeholder Badge -->
  <rect x="180" y="650" width="240" height="44" rx="22" fill="#0f0f18" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.7"/>
  <circle cx="206" cy="672" r="5" fill="#22c55e" />
  <text x="222" y="677" fill="#ffffff" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">PORTRAIT PLACEHOLDER</text>
  
  <!-- Overlay Subtle Tech Dot Matrix -->
  <g fill="#a855f7" fill-opacity="0.3">
    <circle cx="80" cy="120" r="1.5"/><circle cx="100" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/>
    <circle cx="80" cy="140" r="1.5"/><circle cx="100" cy="140" r="1.5"/><circle cx="120" cy="140" r="1.5"/>
    <circle cx="80" cy="160" r="1.5"/><circle cx="100" cy="160" r="1.5"/><circle cx="120" cy="160" r="1.5"/>
    
    <circle cx="480" cy="580" r="1.5"/><circle cx="500" cy="580" r="1.5"/><circle cx="520" cy="580" r="1.5"/>
    <circle cx="480" cy="600" r="1.5"/><circle cx="500" cy="600" r="1.5"/><circle cx="520" cy="600" r="1.5"/>
    <circle cx="480" cy="620" r="1.5"/><circle cx="500" cy="620" r="1.5"/><circle cx="520" cy="620" r="1.5"/>
  </g>
</svg>
